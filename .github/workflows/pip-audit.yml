name: Auditoría de dependencias y calidad de código

# Corre pip-audit en cada push/PR y una vez por semana para no depender de
# que alguien lo ejecute a mano, un chequeo de sintaxis barato (py_compile)
# como red mínima, la suite de tests de cliente/tests/ (pytest), linting
# (ruff, configurado en pyproject.toml), SAST (bandit) y el empaquetado del
# kiosko con PyInstaller (build.spec), con un smoke test del binario y el
# binario mismo subido como artifact, y búsqueda de secretos en el árbol
# (gitleaks).
#
# Las acciones van fijadas por SHA de commit (con la versión en el comentario)
# y no por tag: un tag se puede mover, así que quien comprometa el repo de la
# acción podría cambiar lo que corre acá (y lo que termina dentro del binario
# del kiosko). Dependabot (ecosistema github-actions) actualiza los SHA. Las
# herramientas que se instalan con pip también van con versión fija.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC
  workflow_dispatch:

# El token de cada job solo puede leer el repo: ningún job necesita escribir
# (upload-artifact usa su propio token de runtime, no este).
permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar pip-audit
        run: pip install pip-audit==2.10.1
      - name: Auditar cliente/requirements.txt
        run: pip-audit -r cliente/requirements.txt

  sintaxis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compilar todos los .py (detecta errores de sintaxis)
        run: python -m py_compile $(find . -name "*.py" -not -path "./.git/*")

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias (incluye pytest)
        run: pip install -r cliente/requirements-dev.txt
      - name: Correr tests
        run: pytest cliente/tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install ruff==0.16.7
      - name: Lint (reglas y excepciones en pyproject.toml)
        run: ruff check cliente

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar bandit
        run: pip install bandit==1.9.4
      # -c pyproject.toml: bandit no autodetecta [tool.bandit] como ruff con
      # su propia sección, hay que pasarle el archivo explícitamente.
      - name: SAST (excepciones documentadas y justificadas en pyproject.toml)
        run: bandit -r cliente -x cliente/tests -c pyproject.toml

  build-cliente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Librerías nativas que PyQt6 necesita para poder importarse y correr
      # (no las trae pip, son parte del sistema) -- ubuntu-latest no las
      # incluye por defecto porque no es una imagen de escritorio.
      - name: Instalar librerías de sistema para PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1 libdbus-1-3 libnss3
      # A diferencia del job "tests", instala PyQt6 real (requirements.txt),
      # no solo requirements-dev.txt -- acá sí hace falta para que
      # PyInstaller pueda analizarlo e importarlo.
      - name: Instalar dependencias + PyInstaller
        run: pip install -r cliente/requirements-build.txt
      - name: Empaquetar (PyInstaller, onedir -- ver build.spec)
        working-directory: cliente
        run: pyinstaller build.spec
      # QT_QPA_PLATFORM=offscreen: corre Qt sin necesidad de un servidor X
      # (no hay display en el runner). El kiosko es de pantalla completa y
      # nunca sale solo, así que "sigue corriendo a los 5s" (timeout lo mata,
      # código 124) es la señal de que arrancó bien -- si en cambio crasheó
      # o se cerró solo antes de eso, algo se rompió al empaquetarlo.
      - name: Smoke test del binario empaquetado
        working-directory: cliente
        run: |
          QT_QPA_PLATFORM=offscreen timeout 5 ./dist/biblioteca-kiosko/biblioteca-kiosko
          codigo=$?
          if [ "$codigo" -ne 124 ]; then
            echo "El binario terminó solo (código $codigo) antes de que timeout lo matara;" >&2
            echo "se esperaba que siguiera corriendo (es un kiosko de pantalla completa)." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: biblioteca-kiosko-linux
          path: cliente/dist/biblioteca-kiosko/
          retention-days: 30

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Escanea el árbol actual (no el historial) para que no entre un secreto
      # nuevo: config.ini, db_key.bin y similares nunca deben versionarse.
      # Imagen fijada por digest por el mismo motivo que las acciones por SHA.
      - name: Buscar secretos (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --no-banner --redact
